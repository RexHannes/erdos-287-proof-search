name: Build public review PDF

on:
  push:
    branches: [main]
    paths:
      - '.public-review-src/draft11.tex.gz.b64.part01'
      - '.public-review-src/draft11.tex.gz.b64.part02'
      - '.public-review-src/draft11.tex.gz.b64.gap01'
      - '.public-review-src/draft11.tex.gz.b64.gap02'
      - '.public-review-src/draft11.tex.gz.b64.part03'
      - '.public-review-src/references_draft11.bib.gz.b64'
      - '.github/workflows/build-public-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-public-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Draft 11 sources
        shell: bash
        run: |
          {
            head -c 8000 .public-review-src/draft11.tex.gz.b64.part01
            cat .public-review-src/draft11.tex.gz.b64.part02
            cat .public-review-src/draft11.tex.gz.b64.gap01
            cat .public-review-src/draft11.tex.gz.b64.gap02
            cat .public-review-src/draft11.tex.gz.b64.part03
          } | base64 --decode | gzip --decompress --stdout \
            > twin_prime_programme_draft11.tex
          base64 --decode .public-review-src/references_draft11.bib.gz.b64 \
            | gzip --decompress --stdout \
            > references_draft11.bib
          echo 'c1a9602c45d0a60a12b236879b01ddd17a4ae5d1a51f2ba31728dbbb500e6dac  twin_prime_programme_draft11.tex' | sha256sum -c -
          echo '87acd67f6f0c7e1c7a4924c7298e432375996412388fb5ed076fe3916b5cd088  references_draft11.bib' | sha256sum -c -

      - name: Compile Draft 11
        uses: xu-cheng/latex-action@v4
        with:
          root_file: twin_prime_programme_draft11.tex

      - name: Replace stable public-review PDF
        shell: bash
        run: |
          test -s twin_prime_programme_draft11.pdf
          cp twin_prime_programme_draft11.pdf ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          sha256sum ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf

      - name: Commit updated PDF
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          if git diff --cached --quiet; then
            echo 'Public-review PDF already current.'
            exit 0
          fi
          git commit -m 'Update public review PDF to Draft 11'
          git push
