name: Lean finite 1e60 certificate

on:
  workflow_dispatch:
  push:
    branches:
      - formal/finite-1e60-lean
    paths:
      - 'lakefile.toml'
      - 'RequestProject/Erdos287/PrimeProbe1e60.lean'
      - 'RequestProject/Erdos287/Finite1e60*.lean'
      - '.github/workflows/lean-finite-1e60.yml'

jobs:
  finite-1e60:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: true
      - name: Resolve Lean 4.28-compatible PrimeCert
        run: lake update PrimeCert
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Check generic interval lemma
        run: lake build RequestProject.Erdos287.Finite1e60Core
      - name: Check largest certificate primes
        run: lake build RequestProject.Erdos287.PrimeProbe1e60
