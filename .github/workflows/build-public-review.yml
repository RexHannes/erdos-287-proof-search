name: Build clean Erdos 287 public review V16

on:
  push:
    branches: [main]
    paths:
      - 'ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex'
      - '.github/workflows/build-public-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-public-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean-source layout
        shell: bash
        run: |
          set -euo pipefail
          test -s ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex
          test -s ERDOS287_V16_CLEAN_CONSOLIDATION_AUDIT.md
          test -s ERDOS287_TECHNICAL_VERIFICATION_LEDGER_CURRENT.md
          test -s archive/ERDOS287_TECHNICAL_DOSSIER_V15_PATCHSTACK.pdf
          test -s archive/PUBLIC_REVIEW_DRAFT15_PATCHSTACK.tex

      - name: Write reproducibility metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          cat > buildmeta.tex <<META
          \\newcommand{\\BuildCommit}{${short_sha}}
          \\newcommand{\\BuildDate}{28 August 2026}
          META

      - name: Compile clean V16 public review
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex

      - name: Stage canonical and legacy PDF paths
        shell: bash
        run: |
          test -s ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf ERDOS287_PUBLIC_REVIEW_CURRENT.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          sha256sum \
            ERDOS287_PUBLIC_REVIEW_CURRENT.pdf \
            ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf

      - name: Commit generated clean PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ERDOS287_PUBLIC_REVIEW_CURRENT.pdf ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          if git diff --cached --quiet; then
            echo 'Clean V16 public-review PDFs already current.'
            exit 0
          fi
          git commit -m 'Rebuild clean Erdos 287 public review V16'
          git push
