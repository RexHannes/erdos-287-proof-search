name: Build clean Erdos 287 public review V16

on:
  push:
    branches: [main]
    paths:
      - '.v16-src/v16_bundle.tar.gz.b64.part00'
      - '.v16-src/v16_bundle.tar.gz.b64.part01'
      - '.v16-src/v16_bundle.tar.gz.b64.part02'
      - '.github/workflows/build-public-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-public-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve V15 patch stack and reconstruct V16 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          if [ ! -e archive/ERDOS287_TECHNICAL_DOSSIER_V15_PATCHSTACK.pdf ]; then
            cp ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf \
              archive/ERDOS287_TECHNICAL_DOSSIER_V15_PATCHSTACK.pdf
          fi
          if [ ! -e archive/PUBLIC_REVIEW_DRAFT15_PATCHSTACK.tex ]; then
            cp PUBLIC_REVIEW_DRAFT15.tex \
              archive/PUBLIC_REVIEW_DRAFT15_PATCHSTACK.tex
          fi
          cat \
            .v16-src/v16_bundle.tar.gz.b64.part00 \
            .v16-src/v16_bundle.tar.gz.b64.part01 \
            .v16-src/v16_bundle.tar.gz.b64.part02 \
            | base64 --decode > /tmp/v16_bundle.tar.gz
          echo '0a95265c3f620099889d5ed1302e219f4b35add6839a9025fbabb51f6bc63f2c  /tmp/v16_bundle.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/v16_bundle.tar.gz -C .
          test -s ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex
          test -s ERDOS287_V16_CLEAN_CONSOLIDATION_AUDIT.md
          test -s ERDOS287_TECHNICAL_VERIFICATION_LEDGER_CURRENT.md

      - name: Write reproducibility metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          cat > buildmeta.tex <<META
          \\newcommand{\\BuildCommit}{${short_sha}}
          \\newcommand{\\BuildDate}{28 August 2026}
          META

      - name: Compile clean V16 public review
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex

      - name: Stage canonical and legacy PDF paths
        shell: bash
        run: |
          test -s ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf ERDOS287_PUBLIC_REVIEW_CURRENT.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_CLEAN.pdf ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          sha256sum \
            ERDOS287_PUBLIC_REVIEW_CURRENT.pdf \
            ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf

      - name: Commit clean paper, audit, ledger, archive, and PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ERDOS287_PUBLIC_REVIEW_V16_CLEAN.tex \
            ERDOS287_PUBLIC_REVIEW_CURRENT.pdf \
            ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf \
            README.md \
            ERDOS287_V16_CLEAN_CONSOLIDATION_AUDIT.md \
            ERDOS287_TECHNICAL_VERIFICATION_LEDGER_CURRENT.md \
            frontier/ERDOS287_FRONTIER_STATUS_CURRENT.md \
            archive/README.md \
            archive/ERDOS287_TECHNICAL_DOSSIER_V15_PATCHSTACK.pdf \
            archive/PUBLIC_REVIEW_DRAFT15_PATCHSTACK.tex
          if git diff --cached --quiet; then
            echo 'Clean V16 consolidation already current.'
            exit 0
          fi
          git commit -m 'Publish clean Erdos 287 public review V16'
          git push
