name: Build Erdos 287 public review V16.4 R5

on:
  push:
    branches: [main]
    paths:
      - '.r5-src/r5.tex.xz.b64.part00'
      - '.r5-src/r5.tex.xz.b64.part01'
      - '.r5-src/r5.tex.xz.b64.part02'
      - 'ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.tex'
      - '.github/workflows/build-public-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-public-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct R5 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .r5-src/r5.tex.xz.b64.part00 \
            .r5-src/r5.tex.xz.b64.part01 \
            .r5-src/r5.tex.xz.b64.part02 \
            | base64 --decode | xz -dc \
            > ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.tex
          echo 'ea95a852dfae608e26882bcdee8d9ca672fa964de4d5613a98436c56a2dd5a0e  ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.tex' | sha256sum -c -

      - name: Write reproducibility metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          cat > buildmeta.tex <<META
          \\newcommand{\\BuildCommit}{${short_sha}}
          \\newcommand{\\BuildDate}{28 August 2026}
          META

      - name: Compile R5 public review
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.tex

      - name: Stage R5 publication paths
        shell: bash
        run: |
          set -euo pipefail
          test -s ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.pdf ERDOS287_PUBLIC_REVIEW_CURRENT.pdf
          cp ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.pdf ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          sha256sum \
            ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.pdf \
            ERDOS287_PUBLIC_REVIEW_CURRENT.pdf \
            ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf

      - name: Commit R5 source and public PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.tex \
            ERDOS287_PUBLIC_REVIEW_V16_4_R5_FRONTIER_SYNC.pdf \
            ERDOS287_PUBLIC_REVIEW_CURRENT.pdf \
            ERDOS287_PUBLIC_REVIEW_DRAFT_V2_FINAL.pdf
          if git diff --cached --quiet; then
            echo 'R5 public-review files already current.'
            exit 0
          fi
          git commit -m 'Publish Erdos 287 theory manual R5 frontier sync'
          git push